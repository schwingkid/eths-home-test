<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>YTC Sponsor Controls</title><style>:root{--navy:#1B3A5C;--deep:#122A44;--orange:#E86A2B;--cream:#FAF6EF;--ink:#22303F;--muted:#65727F;--line:#E7E0D3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{width:min(680px,calc(100% - 28px));margin:auto}.top{background:var(--deep);color:white;padding:20px 0}.top a{color:white;text-decoration:none}.page{padding:28px 0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}h1,h2{margin-top:0;color:var(--navy)}label{display:block;font-weight:700;margin:13px 0 6px}input{width:100%;padding:13px;border:1px solid #c9d3da;border-radius:11px;font-size:1rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.button{margin-top:18px;background:var(--orange);color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:1rem}.code{font-size:3.3rem;letter-spacing:.12em;font-weight:900;color:var(--navy);text-align:center;padding:18px 0}.muted{color:var(--muted)}.error{color:#913e35}.ok{color:#3C7A52}@media(max-width:540px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><a href="index.html">← Student Portal</a></div></header><main class="page"><div class="wrap"><section class="card"><h1>Sponsor controls</h1><p class="muted">Open today's meeting. Students who are active club members will see the check-in gate first.</p><label>Meeting title</label><input id="title" value="YTC Club Meeting"><div class="grid"><div><label>Opens</label><input id="opens" type="datetime-local"></div><div><label>Closes</label><input id="closes" type="datetime-local"></div></div><button class="button" id="openBtn">Open meeting</button><div id="msg"></div></section><section class="card" id="active" style="display:none"><h2>Current check-in code</h2><div class="code" id="code"></div><p class="muted" id="activeMeta"></p><p><b>Attendance so far:</b> <span id="count">0</span></p></section></div></main><script>const $=id=>document.getElementById(id);function pad(n){return String(n).padStart(2,'0')}function localValue(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}function init(){const now=new Date(),end=new Date(now.getTime()+4*60*60*1000);$('opens').value=localValue(new Date(now.getTime()-15*60*1000));$('closes').value=localValue(end);refresh()}async function refresh(){try{const r=await fetch('/api/admin-session',{cache:'no-store'}),d=await r.json();if(!r.ok){$('msg').innerHTML=`<p class="error">${d.error==='admin_required'?'Sponsor/admin membership required.':'Admin service not ready.'}</p>`;return}if(d.session){$('active').style.display='block';$('code').textContent=d.session.checkin_code;$('activeMeta').textContent=`${d.session.title} · ${d.session.session_date}`;$('count').textContent=d.attendanceCount}}catch(e){}}$('openBtn').onclick=async()=>{const opens=new Date($('opens').value),closes=new Date($('closes').value);if(!Number.isFinite(opens.getTime())||!Number.isFinite(closes.getTime()))return;$('openBtn').disabled=true;$('msg').textContent='Opening meeting…';const r=await fetch('/api/admin-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:$('title').value,sessionDate:$('opens').value.slice(0,10),opensAt:opens.toISOString(),closesAt:closes.toISOString()})});const d=await r.json();$('openBtn').disabled=false;if(!r.ok){$('msg').innerHTML=`<p class="error">Could not open meeting: ${d.error}</p>`;return}$('msg').innerHTML='<p class="ok">Meeting open. Put the code where students can see it.</p>';await refresh()};init();setInterval(refresh,30000)</script></body></html>
